[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cure-lite-v22"
version = "0.22.0"
description = "Append-only PACRE candidate package for CURE-Lite v22"
requires-python = ">=3.10"
dependencies = [
    "cure-lite==0.2.0",
    "torch>=2.1",
]

[tool.setuptools]
packages = ["cure_lite_v22"]
package-dir = {cure_lite_v22 = "."}
